name: Spec Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-spec-change:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect spec.md changes
        id: spec-check
        run: |
          CHANGED_FILES=$(git diff --name-only "origin/${{ github.event.pull_request.base.ref }}" "origin/${{ github.event.pull_request.head.ref }}")

          if echo "$CHANGED_FILES" | grep -q 'spec\.md$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log when spec.md was not changed
        if: steps.spec-check.outputs.changed == 'false'
        run: echo "spec.md não foi alterado neste Pull Request."

      - name: Comment on Pull Request
        if: steps.spec-check.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "A especificação foi modificada. A CI detectou a alteração com sucesso."
            });
